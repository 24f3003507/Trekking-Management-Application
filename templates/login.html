<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <img src="/static/images/logo.png" alt="Logo" class="logo">
            <h1>Trekking Management Application</h1>

        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% for category,message in messages %}

                <div class="flash {{category}}">{{message}}</div>
            {% endfor %}
        {% endwith %}
        
        <div class="login-box">
            <h2>Login</h2>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn" >Login</button>
            </form>

            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register as User</a>.</p>
            <p>Guide person? <a href="{{ url_for('auth.register_staff') }}">Register as Staff</a>.</p>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{2026}} AllHikers</p>
        </div>
    </footer>
</body>
</html>
