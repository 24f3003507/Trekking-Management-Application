{% extends "base.html" %}
{% block title %} Update Profile {% endblock %}

{% block cards %}
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
<div class="profile-container">
    <h1>My Profile</h1>
    <p class="profile-subtitle">Update your personal information below.</p>

    <form method="POST" action="{{ url_for('auth.update_profile') }}" class="profile-form">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name or '' }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ user.email or '' }}" required>
        </div>

        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input type="tel" id="phone_number" name="phone_number" value="{{ user.phone_number or '' }}" placeholder="e.g. 9876543210">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-save">Save Changes</button>
            <a href="{{ url_for('auth.user_dashboard', name=session.get('username'), id=session.get('id')) }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
