<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllHikers</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <header style="background: transparent;position: absolute; top:0;left: 0;width: 100%; z-index: 100; background:rgba(0,0,0,0.2);">
        <nav style="display: flex;justify-content: space-between;align-items: center;padding: 10px 30px;">
            <div class="logo0" style="display: flex;align-items: center;gap: 8px;">
                <h2>🏔️ AllHikers</h2>
            </div>

            <ul>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Treks</a></li>
                <li><a href="#">About</a></li>
                <div class="center"><a href="/login" type="button" class="btn1">Login</a></div>
            </ul>
        </nav>
        
    </header>

    <section class="hero" style="margin-top: 0;padding-top: 0;">

        <div class="overlay"></div>

        <div class="hero-content">

            <h1>Find Your Next Adventure</h1>

            <div class="search-box">
                <input
                    type="text"
                    placeholder="Search by city, mountain, or trail name">
            </div>

            <div class="buttons">
                <a href="#" class="btn">Explore Trails</a>
                <a href="#" class="btn">Build Route</a>
            </div>

        </div>

    </section>

</body>
</html>
