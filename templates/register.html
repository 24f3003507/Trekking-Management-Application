<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <img src="/static/images/logo.png" alt="Logo" class="logo">
            <h1>AllHikers</h1>

        </div>
    </header>
    <main class="container">
        <div class="register-box">
            <h2>Register</h2>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" id="location" placeholder="Valcherry">
                </div>
                <div class="form-group">
                    <label for="pin_code" class="form-label">Pin code</label>
                    <input type="text" class="form-control" name="pin_code" id="pin_code" placeholder="500001">
                </div>
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="full_name" id="full_name" placeholder="John Doe">
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.</p>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{2026}} AllHikers</p>
        </div>
    </footer>
</body>
</html>
